<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ResumeAI Pro</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; }
        header h1 { font-size: 22px; color: #4f46e5; display: flex; align-items: center; gap: 10px; }
        .btn-home { background: #6366f1; color: white; padding: 10px 18px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .btn-home:hover { background: #4f46e5; }
        
        /* Stat Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border-left: 5px solid #6366f1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat-card h3 { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .stat-card p { font-size: 28px; font-weight: 800; color: #0f172a; }
        
        /* Table */
        .table-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header h2 { font-size: 18px; color: #334155; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 700; }
        tr:hover { background-color: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-warning { background: #fef9c3; color: #a16207; }
        .badge-danger { background: #fee2e2; color: #b91c1c; }
        
        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .btn-view { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-view:hover { background: #2563eb; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-delete:hover { background: #dc2626; }

        /* Modal (View Details Popup) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }
        .modal-header h3 { color: #1e293b; font-size: 18px; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }
        .modal-body p { margin-bottom: 10px; font-size: 14px; color: #334155; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Top Header -->
        <header>
            <h1><i class="fa-solid fa-user-shield"></i> ResumeAI Admin Panel</h1>
            <a href="index.html" class="btn-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </header>

        <!-- Live Statistics -->
        <div class="stats-grid">
            <div class="stat-card" style="border-color: #6366f1;">
                <h3>Total Resumes Analyzed</h3>
                <p id="totalResumes">0</p>
            </div>
            <div class="stat-card" style="border-color: #22c55e;">
                <h3>Average ATS Score</h3>
                <p id="avgScore">0%</p>
            </div>
            <div class="stat-card" style="border-color: #eab308;">
                <h3>High Match (70%+)</h3>
                <p id="highMatchCount">0</p>
            </div>
        </div>

        <!-- All User Submissions Table -->
        <div class="table-card">
            <div class="table-header">
                <h2><i class="fa-solid fa-database"></i> Live Database Entries (Firebase)</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Upload Date</th>
                        <th>ATS Score</th>
                        <th>Matched Skills</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="6" style="text-align: center;">Loading Firebase Data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- View Details Modal (Popup) -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-invoice"></i> Resume Details</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
      // 1. Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCRQzI_BS3vlDskyhkzu61oHEQUcSHUMjU",
        authDomain: "studentdata-2f3cb.firebaseapp.com",
        databaseURL: "https://studentdata-2f3cb-default-rtdb.firebaseio.com",
        projectId: "studentdata-2f3cb",
        storageBucket: "studentdata-2f3cb.firebasestorage.app",
        messagingSenderId: "1061655468370",
        appId: "1:1061655468370:web:a79deaf5e6c3038c7ec28b",
        measurementId: "G-EQ8PT4Q1FG"
      };

      // 2. Initialize Firebase
      if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
      let globalData = {};

      // 3. Fetch All Submissions from Firebase
      function loadAdminData() {
          const historyRef = db.ref('resume_history');

          historyRef.on('value', (snapshot) => {
              const tableBody = document.getElementById('adminTableBody');
              tableBody.innerHTML = '';
              const data = snapshot.val();
              globalData = data || {};

              if (!data) {
                  tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No records found in database.</td></tr>';
                  updateStats(0, 0, 0);
                  return;
              }

              let total = 0;
              let scoreSum = 0;
              let highMatch = 0;

              Object.keys(data).reverse().forEach((key) => {
                  const item = data[key];
                  total++;
                  const score = item.score || 0;
                  scoreSum += score;
                  if (score >= 70) highMatch++;

                  let statusBadge = '<span class="badge badge-success">Passed</span>';
                  if (score < 50) {
                      statusBadge = '<span class="badge badge-danger">Low Match</span>';
                  } else if (score < 70) {
                      statusBadge = '<span class="badge badge-warning">Needs Work</span>';
                  }

                  const row = document.createElement('tr');
                  row.innerHTML = `
                      <td><strong><i class="fa-regular fa-file-pdf"></i> ${item.fileName || 'Resume.pdf'}</strong></td>
                      <td>${item.uploadDate || 'N/A'}</td>
                      <td><strong>${score}%</strong></td>
                      <td>${item.matchedSkills || 0} Skills</td>
                      <td>${statusBadge}</td>
                      <td>
                          <div class="action-btns">
                              <button class="btn-view" onclick="viewRecord('${key}')">
                                  <i class="fa-solid fa-eye"></i> View
                              </button>
                              <button class="btn-delete" onclick="deleteRecord('${key}')">
                                  <i class="fa-solid fa-trash"></i> Delete
                              </button>
                          </div>
                      </td>
                  `;
                  tableBody.appendChild(row);
              });

              const avg = total > 0 ? Math.round(scoreSum / total) : 0;
              updateStats(total, avg, highMatch);
          });
      }

      function updateStats(total, avg, highMatch) {
          document.getElementById('totalResumes').innerText = total;
          document.getElementById('avgScore').innerText = avg + '%';
          document.getElementById('highMatchCount').innerText = highMatch;
      }

      // View Record Details in Popup
      function viewRecord(key) {
          const item = globalData[key];
          if (!item) return;

          const modalBody = document.getElementById('modalBody');
          modalBody.innerHTML = `
              <p><strong>File Name:</strong> ${item.fileName || 'N/A'}</p>
              <p><strong>Upload Date:</strong> ${item.uploadDate || 'N/A'}</p>
              <p><strong>ATS Score:</strong> ${item.score || 0}%</p>
              <p><strong>Matched Skills:</strong> ${item.matchedSkills || 0}</p>
              <p><strong>Record ID:</strong> ${key}</p>
          `;
          document.getElementById('viewModal').style.display = 'flex';
      }

      function closeModal() {
          document.getElementById('viewModal').style.display = 'none';
      }

      // Delete Record
      function deleteRecord(key) {
          if (confirm("Are you sure you want to delete this record from Firebase?")) {
              db.ref('resume_history/' + key).remove();
          }
      }

      document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
