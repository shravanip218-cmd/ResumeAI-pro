<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ResumeAI Pro</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-file-circle-check"></i> ResumeAI Pro
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>
</header>

<section class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please login to access your dashboard</p>

            <form id="loginForm">
                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter Email" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="login-btn-full">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>

                <p class="register-text">
                    Don't have an account? <a href="register.html">Register Here</a>
                </p>
            </form>
        </div>
    </div>
</section>

<!-- Script: Redirects directly to dashboard.html -->
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevents page reload
        window.location.href = 'dashboard.html'; // Directs to correct dashboard link
    });
</script>

</body>
</html>
